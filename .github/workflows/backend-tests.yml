# CI : tests backend (pytest) + build frontend.
# Declenche sur push & pull_request sur main, et manuellement.
name: Backend tests + frontend build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Annule les runs precedents si un nouveau push arrive sur la meme branche/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-deps-python:
    name: pip-audit (CVE deps Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Non bloquant : on signale mais on ne casse pas la CI sur des CVE upstream
    # qui peuvent prendre du temps a fixer. Devient bloquant quand on aura
    # nettoye les CVE existantes (cf. docs/SECURITY_DEPENDENCIES.md).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit (soft fail temporaire)
        # --strict pour exit 1 sur les vulnerabilites
        # --ignore-vuln pour ignorer une CVE specifique (ex: connue/non exploitable)
        run: pip-audit -r requirements.txt --desc || true

  audit-deps-node:
    name: npm audit (CVE deps Node)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run npm audit (soft fail temporaire)
        # `--audit-level=high` : on ignore low/moderate (souvent dev deps)
        run: npm audit --audit-level=high --omit=dev || true

  lint:
    name: ruff (smoke, bloquant)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff smoke (bloquant)
        # Périmètre stable et critique. Règles volontairement restreintes (E/F)
        # pour ne pas bloquer sur la dette I/B/UP des gros modules legacy.
        run: |
          ruff check --select E,F --ignore E501,E402,F841 \
            backend/security.py \
            backend/main.py \
            backend/audit_log.py \
            backend/routes/admin.py \
            backend/routes/voice.py \
            tests/test_admin_security_audit.py \
            tests/test_audit_log.py \
            tests/test_debug_endpoints_guard.py \
            tests/test_call_lock_pg.py \
            tests/test_auth_google_sso.py

  lint-full:
    name: ruff full (info only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff full (soft fail temporaire)
        # Visibilité sur la dette restante sans bloquer le pipeline.
        run: ruff check backend tests || true

  backend-tests:
    name: pytest (backend smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Secrets minimaux pour eviter les 503 dans les tests
      JWT_SECRET: test-secret-pytest-min-32-bytes-long-for-hmac
      ADMIN_API_TOKEN: test-admin-token-pytest
      ADMIN_EMAIL: admin@uwiapp.com
      ADMIN_PASSWORD: adminuwi123
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      ALLOW_GOOGLE_SELF_SIGNUP: "false"
      # Skip les checks externes (DB, Twilio, etc.)
      ADMIN_DEMO_MODE: ""
      ENABLE_DEBUG_ENDPOINTS: ""
      VAPI_SIGNATURE_DISABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest smoke (bloquant)
        # Suite stable et critique pour bloquer les regressions securite/API
        # sans etre penalisee par les tests legacy encore instables.
        run: |
          python -m pytest -q --tb=line --maxfail=5 \
            tests/test_admin_security_audit.py \
            tests/test_audit_log.py \
            tests/test_debug_endpoints_guard.py \
            tests/test_call_lock_pg.py \
            tests/test_auth_google_sso.py \
            tests/test_admin_api.py::test_get_calls_list_merges_ivr_events_when_vapi_calls_exist

      - name: Upload coverage XML
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  backend-tests-full:
    name: pytest full (info only)
    # Le full est utile pour la visibilité qualité, mais allonge trop
    # la voie de déploiement sur push main (~8 min).
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true

    env:
      JWT_SECRET: test-secret-pytest-min-32-bytes-long-for-hmac
      ADMIN_API_TOKEN: test-admin-token-pytest
      ADMIN_EMAIL: admin@uwiapp.com
      ADMIN_PASSWORD: adminuwi123
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      ALLOW_GOOGLE_SELF_SIGNUP: "false"
      ADMIN_DEMO_MODE: ""
      ENABLE_DEBUG_ENDPOINTS: ""
      VAPI_SIGNATURE_DISABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest full (soft fail temporaire)
        run: |
          python -m pytest -q --tb=line --maxfail=10 \
            --cov=backend --cov-report=term-missing:skip-covered \
            --cov-report=xml --cov-fail-under=50 || true

  frontend-build:
    name: vite build (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
