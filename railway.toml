[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
# IMPORTANT : écrase les « Watch Paths » du dashboard Railway.
# landing/** → Vercel uniquement (www.uwiapp.com). Ne pas surveiller landing ici :
# sinon SKIPPED ou rebuilds inutiles sans changement API.
# Toucher backend/DEPLOY_REVISION pour forcer un déploiement Railway à la main.
watchPatterns = [
  "backend/**",
  "frontend/**",
  "migrations/**",
  "scripts/**",
  "Dockerfile",
  "requirements.txt",
  "pyproject.toml",
  "railway.toml",
]

[deploy]
# Healthcheck désactivé : le deploy réussit sans attendre /health (voir docs/RAILWAY_HEALTHCHECK.md).
# healthcheckPath = "/health"
# healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
