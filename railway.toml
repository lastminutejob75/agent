[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
# IMPORTANT : écrase les « Watch Paths » du dashboard Railway.
# Sans cette liste, le dashboard garde souvent backend/** seul → SKIPPED sur les commits landing/.
# Tout changement utile dans le repo doit déclencher un déploiement API.
watchPatterns = [
  "backend/**",
  "frontend/**",
  "landing/**",
  "migrations/**",
  "scripts/**",
  "tests/**",
  ".github/**",
  "docs/**",
  "railway.toml",
  "railway.json",
  "Dockerfile",
  "requirements.txt",
  "pyproject.toml",
  "package.json",
  "package-lock.json",
]

[deploy]
# Healthcheck désactivé : le deploy réussit sans attendre /health (voir docs/RAILWAY_HEALTHCHECK.md).
# healthcheckPath = "/health"
# healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
